[project]
name = "ultron-livekit-agent"
version = "1.0.0"
description = "ULTRON's server-side voice brain: Groq STT → Gemini/Groq/OpenRouter LLM → Fish Audio TTS"
requires-python = ">=3.10"
dependencies = [
    "livekit-agents[openai,fish-audio,silero]~=1.5",
    "python-dotenv>=1.0",
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "ruff>=0.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# agent.py is a standalone script, not an installable package — uv sync
# must not try to build this project into a wheel.
[tool.uv]
package = false
