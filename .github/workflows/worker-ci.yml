name: Worker CI

on:
  push:
    branches: ["**"]
    paths:
      - "livekit-agent/**"
      - ".github/workflows/worker-ci.yml"
  pull_request:
    paths:
      - "livekit-agent/**"
      - ".github/workflows/worker-ci.yml"
  workflow_dispatch:

jobs:
  build:
    name: Resolve deps & import check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: livekit-agent

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Pinned for reproducible installs. Bump the Python version here when
      # you upgrade livekit-agents (it currently requires Python >= 3.10).
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: livekit-agent/uv.lock

      # Fully resolves the dependency tree (livekit-agents + STT/TTS plugins)
      # and writes uv.lock — catches version conflicts that would otherwise
      # surface as a broken `uv sync` on your machine.
      - name: Resolve dependencies (uv sync)
        run: uv sync

      # Compile + import the agent script inside the resolved environment.
      # Verifies the livekit-agents API surface still matches (imports,
      # WorkerOptions, AgentSession wiring) even without LiveKit keys.
      - name: Import check (uv run python agent.py)
        run: uv run python -c "import runpy; runpy.run_path('agent.py', run_name='ultron_import_check')"

      - name: Lint (ruff)
        run: uv run ruff check agent.py

      # Same repo-wide secret scan as ci.yml — this workflow also fires on
      # livekit-agent changes, so secrets can't hide in the Python side.
      - name: Secret scan (full history)
        working-directory: .
        shell: bash
        run: |
          PATTERNS='AIza[0-9A-Za-z_-]{30,}|gsk_[A-Za-z0-9]{20,}|sk-or-[A-Za-z0-9-]{20,}|(FISH_AUDIO_API_KEY|FISH_AUDIO_VOICE_ID|LIVEKIT_API_SECRET|LIVEKIT_API_KEY|GEMINI_API_KEY|GROQ_API_KEY|OPENROUTER_API_KEY)=[A-Za-z0-9_-]{8,}'
          HITS=$(git grep -hE "$PATTERNS" $(git rev-list --all) -- 2>/dev/null | sort -u | head -20)
          if [ -n "$HITS" ]; then
            echo " 🚨 POTENTIAL SECRETS FOUND IN REPOSITORY HISTORY:"
            echo "$HITS" | sed 's/^/    /' | cut -c1-140
            exit 1
          fi
          echo "✅ No secrets found anywhere in history."
