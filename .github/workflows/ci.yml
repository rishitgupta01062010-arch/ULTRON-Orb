name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build:
    name: Typecheck & build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Typecheck + build catch syntax errors, broken imports, and type
      # regressions. The app builds without API keys (routes return clean
      # 503s), so no secrets are needed in CI.
      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
